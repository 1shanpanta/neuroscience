[project]
name = "bci-sim"
version = "0.0.1"
description = "Software-only BCI simulator: spikes, decoder, center-out task, EEG and hardware stubs"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "scikit-learn"]

[project.optional-dependencies]
eeg = ["brainflow", "pylsl"]
hardware = ["pyserial"]
